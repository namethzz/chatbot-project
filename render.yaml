# Render Blueprint สำหรับ backend (Express)
# Render → New → Blueprint → เลือก repo นี้ แล้วกรอกค่า env ที่ขึ้น sync: false
services:
  - type: web
    name: agri-chatbot-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: RAG_API_URL
        sync: false
      - key: RAG_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
